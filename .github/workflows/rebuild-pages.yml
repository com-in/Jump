name: Rebuild Pages

# 每次 push 到 main（包括别人 PR 合并后）都主动请求 GitHub Pages 重新构建
# 也可以在 Actions 页面点 "Run workflow" 手动触发一次重建
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"