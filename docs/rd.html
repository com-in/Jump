<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面跳转中…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #fff;
      color: #666;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #eee;
      border-top-color: #999;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>loading…</p>

  <script>
    // 解析 links.txt：[xxx] 分节，一行一个链接，空格后为简介，以 # 开头的行忽略
    function parseLinks(text) {
      const pools = {};
      let current = null;
      text.replace(/^\uFEFF/, "").split(/\r?\n/).forEach((line) => {
        line = line.trim();
        if (!line || line.startsWith("#")) return;
        const section = line.match(/^\[(\w+)\]$/);
        if (section) {
          current = section[1];
          pools[current] = pools[current] || [];
          return;
        }
        const m = line.match(/^(https?:\/\/\S+)\s*(.*)$/i);
        if (current && m) pools[current].push({ url: m[1], desc: m[2] });
      });
      return pools;
    }

    // 读取 links.txt 的国际池（[intl]），改链接只需改这一个文件
    fetch("links.txt", { cache: "no-store" })
      .then((res) => res.text())
      .then((text) => {
        const pool = parseLinks(text).intl || [];
        if (!pool.length) throw new Error("links.txt 没有可用的链接");

        // ?i=序号 指定 links.txt 中第 N 条链接（从 1 开始）；无效或未指定时随机
        const idx = parseInt(new URLSearchParams(location.search).get("i"), 10);
        const target = (pool[idx - 1] || pool[Math.floor(Math.random() * pool.length)]).url;

        // 停顿 1 秒后跳转；用 replace，让对方按返回键回不到本页
        setTimeout(() => {
          window.location.replace(target);
        }, 1000);
      })
      .catch(() => {
        document.querySelector("p").textContent = "Failed to load links.txt";
      });
  </script>
</body>
</html>
